[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyglance"
version = "0.2.1"
description = "Ask Claude what's flying above you — live ADS-B positions, aircraft identity, routes, photos, and your own sighting history. No API keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Darsh Joshi", email = "contact@darshjoshi.com" },
]
keywords = [
    "adsb", "aviation", "flight-tracking", "mcp", "claude",
    "model-context-protocol", "planespotting", "aircraft",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # The <2 bound is load-bearing, not caution. mcp 2.0 removed mcp.server.fastmcp,
    # which every tool in this package is built on. A sibling project shipped without
    # this bound and every new install broke the day 2.0 was published.
    # >=1.10 is for tool titles and annotations (readOnlyHint), which the directory requires.
    "mcp>=1.10.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/darshjoshi/skyglance-mcp"
Repository = "https://github.com/darshjoshi/skyglance-mcp"
Issues = "https://github.com/darshjoshi/skyglance-mcp/issues"

[project.scripts]
skyglance = "skyglance.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skyglance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
